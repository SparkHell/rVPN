[package]
name = "rvpn-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"

description = "R-VPN client implementation"

[lib]
name = "rvpn_client"
path = "src/lib.rs"

[[bin]]
name = "rvpn"
path = "src/main.rs"

[dependencies]
fslock = "0.2"
hickory-proto.workspace = true
rvpn-core = { path = "../rvpn-core" }
rvpn-logging = { path = "../rvpn-logging" }
rvpn-tls = { path = "../rvpn-tls" }
rvpn-split-tunnel = { path = "../rvpn-split-tunnel" }

# Crypto (for direct key handling)
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
subtle.workspace = true

# Async
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

# WebSocket
tokio-tungstenite.workspace = true
tungstenite.workspace = true

# TLS - rvpn-tls provides boring (desktop/macOS) and rustls (iOS) backends

# TUN
tun-rs.workspace = true

# Networking
ip_network_table.workspace = true
ip_network.workspace = true
socket2 = "0.5"

# Data structures
lru.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# CLI
clap.workspace = true

# Time
chrono.workspace = true

# Utilities
bytes.workspace = true
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
uuid.workspace = true
base64.workspace = true
hex.workspace = true
sha1.workspace = true
rand.workspace = true
url.workspace = true
futures-util.workspace = true
lazy_static.workspace = true
parking_lot.workspace = true
dirs = "5.0"
tempfile.workspace = true

# mimalloc global allocator — glibc malloc arenas retain memory indefinitely
# under this client's allocation churn (long-running Linux installs grew
# ~5 MB/hour in RSS; MALLOC_ARENA_MAX=2 proved arena retention, not a leak).
# Optional so diagnostics builds can use the system allocator.
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
default = ["mimalloc"]

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader", "Win32_UI_Shell",
] }
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "2"

# BoringSSL — not available on Android (NDK linker can't resolve static lib symbols).
# Android uses rustls instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
boring.workspace = true
tokio-boring.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen = "0.13"
tokio-tungstenite.workspace = true
# test-util: paused-clock tests for the tunnel-pool drain backstop
tokio = { workspace = true, features = ["test-util"] }
# Test-only: also enable rvpn-tls's rustls backend so tests can observe the
# resumption store's shared state through the ClientSessionStore trait (the
# boring side exposes no public inspection hook).
rvpn-tls = { path = "../rvpn-tls", features = ["rustls"] }
rustls.workspace = true
